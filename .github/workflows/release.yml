name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.pp.outputs.release_created }}
      tag: ${{ steps.pp.outputs.tag_name }}
      version: ${{ steps.pp.outputs.version }}
      major: ${{ steps.pp.outputs.major }}
      minor: ${{ steps.pp.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
      # publish-please releases itself
      - uses: ./
        id: pp
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

  binaries:
    needs: publish-please
    if: needs.publish-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.publish-please.outputs.version }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            name=publish-please_${VERSION}_${os}_${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/MdTanvirHossainTusher/publish-please/internal/cli.Version=${VERSION}" \
              -o "dist/${name}/publish-please${ext}" ./cmd/publish-please
            cp LICENSE README.md "dist/${name}/"
            (cd dist && tar -czf "${name}.tar.gz" "${name}" && rm -rf "${name}")
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.publish-please.outputs.tag }}" dist/*

  image:
    needs: publish-please
    if: needs.publish-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: VERSION=${{ needs.publish-please.outputs.version }}
          tags: |
            ghcr.io/mdtanvirhossaintusher/publish-please:${{ needs.publish-please.outputs.version }}
            ghcr.io/mdtanvirhossaintusher/publish-please:${{ needs.publish-please.outputs.major }}
            ghcr.io/mdtanvirhossaintusher/publish-please:latest
