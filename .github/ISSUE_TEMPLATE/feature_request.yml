name: Feature request
description: Suggest a new feature, release type or forge
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like publish-please to do?
  - type: input
    id: release-please
    attributes:
      label: Does release-please support this? Link, if so.
